name: Actualizar Submódulos

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar submódulos al último commit de su rama
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Verificar cambios y hacer commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: actualizar submódulos a su última versión"
            git push origin main
          else
            echo "Los submódulos ya se encuentran actualizados."
          fi